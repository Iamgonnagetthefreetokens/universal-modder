<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Ultimate World Cup 26 — arcade football in the browser</title>
    <meta
      name="description"
      content="A complete World Cup football game: 32 nations, group stage to final, extra time, penalties you actually take, procedural crowd and commentary. No install, no assets, no build step."
    />
    <meta name="theme-color" content="#0a0d12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23fff'/%3E%3Cpath d='M16 6l6 4-2 7h-8l-2-7z' fill='%230a0d12'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="pitch"></canvas>
      <div id="hudHost"></div>
      <div id="ui"></div>
      <noscript
        ><p style="color: #fff; padding: 2rem; font: 16px system-ui">Ultimate World Cup needs JavaScript enabled.</p></noscript
      >
    </div>
    <script type="module">
      import { Game } from './src/main.js';

      const game = new Game({
        canvas: document.getElementById('pitch'),
        stage: document.getElementById('stage'),
        uiRoot: document.getElementById('ui'),
        hudHost: document.getElementById('hudHost'),
      });
      window.ultimateWorldCup = game;
      game.boot();
    </script>
  </body>
</html>
